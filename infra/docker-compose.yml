services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zalo_center}
      POSTGRES_USER: ${POSTGRES_USER:-zalo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 3s, retries: 15 }
    networks: [internal]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/.env}"]
    volumes: ["redis_data:/data"]
    networks: [internal]
  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: [../apps/api/.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zalo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zalo_center}?schema=public
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in infra/.env}
      PORT: 4000
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["127.0.0.1:4000:4000"]
    networks: [internal]
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in infra/.env}
    restart: unless-stopped
    environment: { NODE_ENV: production }
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]
    networks: [internal]
networks:
  internal: { driver: bridge }
volumes:
  postgres_data:
  redis_data:
